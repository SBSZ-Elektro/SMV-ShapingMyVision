<style>
/* Farben und Schrift nach den Vorlagen „Arbeitsblatt / Leistungsnachweis SBSZ Bamberg ET“ */
:root{
 --blau:#005CA9;--blau-hell:#E8F0F9;--blau-linie:#C9D9EC;--blau-flaeche:#F2F6FB;--blau-zart:#DCE8F5;
 --gruen-logo:#94C01C;--gelb-logo:#FCCC03;
 --gruen:#2E8B22;--gruen-hell:#EAF5E6;
 --gelb-hell:#FFF7D6;
 --rot:#C62828;--rot-hell:#FDECEA;
 --grau:#6B6B6B;--grau-hell:#9A9A9A;--linie:#C8C8C8;--formel:#F3F3F3;
 --text:#1E1E1E;--bg:#F7F8FA
}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:16px;background:var(--bg);color:var(--text);line-height:1.45}
a{color:var(--blau)}

/* Kopf wie in der Vorlage: Logo · Schulname · blaues Etikett, darunter Farbstreifen */
header{background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--linie)}
.kopf{max-width:1050px;margin:0 auto;padding:10px 18px 0;display:flex;align-items:center;gap:12px}
.kopf img{height:46px;width:auto;display:block}
.kopf .schule{flex:1;min-width:0}
.kopf .schule b{display:block;color:var(--blau);font-size:17px;line-height:1.2}
.kopf .schule span{display:block;color:var(--grau);font-size:13px}
.kopf .etikett{background:var(--blau);color:#fff;text-align:center;padding:7px 18px;min-width:190px}
.kopf .etikett small{display:block;font-weight:bold;letter-spacing:.12em;font-size:12px}
.kopf .etikett span{display:block;color:var(--blau-zart);font-size:13px}
.kopf .etikett span b{color:#fff;font-size:17px}
.streifen{max-width:1050px;margin:8px auto 0;padding:0 18px}
.streifen div{height:5px;background:linear-gradient(90deg,var(--blau) 0 72%,var(--gruen-logo) 72% 90%,var(--gelb-logo) 90% 100%)}

nav{max-width:1050px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px}
nav button{border:1px solid var(--blau-linie);background:#fff;color:var(--text);border-radius:4px;padding:6px 13px;cursor:pointer;font:inherit;font-size:15px}
nav button:hover{background:var(--blau-flaeche)}
nav button.aktiv{background:var(--blau);color:#fff;border-color:var(--blau)}

main{max-width:1050px;margin:0 auto;padding:18px}
/* Überschriften wie „Thema“ / „Überschrift 1“ / „Abschnitt“ */
h2{color:var(--blau);margin:4px 0 12px;font-size:24px;padding-bottom:4px;border-bottom:1px solid var(--blau-linie)}
h3{margin:16px 0 8px;font-size:17px;color:var(--text)}
.karte{background:#fff;border:1px solid var(--blau-linie);border-radius:4px;padding:18px;margin-bottom:14px}

/* Kästen wie in der Vorlage */
.hinweis,.info{background:var(--blau-hell);border-left:6px solid var(--blau);padding:10px 14px;font-size:15px}
.merke{background:var(--gelb-hell);border-left:6px solid var(--gelb-logo);padding:10px 14px;margin:10px 0}
.challenge{border-left:6px solid var(--gelb-logo)}
.achtung{background:var(--rot-hell);border-left:6px solid var(--rot);padding:10px 14px}

.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.station{background:#fff;border:1px solid var(--blau-linie);border-top:4px solid var(--blau);border-radius:4px;padding:14px;cursor:pointer;position:relative;transition:transform .1s,box-shadow .1s}
.station:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,92,169,.15)}
.station.ok{border-top-color:var(--gruen-logo)}
.station .icon{font-size:30px}
.station h3{margin:6px 0 4px;color:var(--blau)}
.station p{margin:0;font-size:14px;color:var(--grau)}
.balken{height:8px;background:var(--blau-hell);overflow:hidden;margin-top:10px}
.balken div{height:100%;background:var(--gruen-logo)}
.status{font-size:13px;margin-top:6px;color:var(--grau)}
.badge{position:absolute;top:10px;right:10px;font-size:12px;padding:2px 8px;background:var(--blau-hell);color:var(--blau)}
.badge.ok{background:var(--gruen);color:#fff}

.tabs{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap;border-bottom:1px solid var(--blau-linie)}
.tabs button{border:none;border-bottom:3px solid transparent;background:none;padding:8px 10px;cursor:pointer;font:inherit;font-size:15px;color:var(--text);margin-bottom:-1px}
.tabs button.aktiv{border-color:var(--blau);color:var(--blau);font-weight:bold}

.btn{background:var(--blau);color:#fff;border:none;border-radius:4px;padding:9px 16px;cursor:pointer;font:inherit;font-size:15px}
.btn:hover{background:#004A8A}
.btn.zweit{background:#fff;color:var(--blau);border:1px solid var(--blau)}
.btn.zweit:hover{background:var(--blau-flaeche)}
.btn.gruen{background:var(--gruen)}
.btn:disabled{opacity:.5;cursor:default}

.flip{perspective:1000px;height:220px;margin:10px 0}
.flip .innen{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flip.um .innen{transform:rotateY(180deg)}
.seite{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--blau-linie);border-left:6px solid var(--blau);background:var(--blau-flaeche);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:19px}
.seite.rueck{transform:rotateY(180deg);background:var(--gruen-hell);border-color:var(--gruen);color:var(--gruen);font-size:17px}
.fach{display:flex;gap:8px;margin:8px 0;font-size:14px;flex-wrap:wrap}
.fach span{padding:3px 10px;background:var(--blau-hell)}

.frage{font-size:18px;margin:6px 0 10px}
.optionen label{display:block;border:1px solid var(--blau-linie);padding:9px 12px;margin:6px 0;cursor:pointer;background:#fff}
.optionen label:hover{background:var(--blau-flaeche)}
.optionen label.richtig{background:var(--gruen-hell);border-color:var(--gruen)}
.optionen label.falsch{background:var(--rot-hell);border-color:var(--rot)}
input[type=text],select{font:inherit;font-size:16px;padding:7px 9px;border:1px solid var(--grau-hell);border-radius:3px}
input[type=text]:focus,select:focus{outline:2px solid var(--blau);outline-offset:1px}
#eing,#treing{width:150px}
.feedback{margin-top:10px;padding:10px 14px;font-size:15px}
.feedback.ok{background:var(--gruen-hell);border-left:6px solid var(--gruen)}
.feedback.ok b{color:var(--gruen)}
.feedback.nein{background:var(--rot-hell);border-left:6px solid var(--rot)}
.zuord{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;max-width:640px}
.fortschritt{font-size:14px;color:var(--grau);margin-bottom:6px}

/* Tabellen wie in der Vorlage: blauer Kopf, hellblaue Linien */
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--blau-linie);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--blau);color:#fff}
.woche.erledigt{background:var(--gruen-hell)}
.ergebnis{font-size:24px;font-weight:bold;color:var(--blau)}
.klein{font-size:14px;color:var(--grau)}
.formel{font-family:"Cambria Math",Georgia,serif;font-size:17px;background:var(--formel);padding:8px;text-align:center}

/* Fußzeile wie in der Vorlage */
footer{max-width:1050px;margin:20px auto;padding:6px 18px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--grau)}
footer .linie{border-top:1px solid var(--linie);width:100%}
svg text{font-family:Calibri,Carlito,Arial,sans-serif}
@media(max-width:640px){
 header{position:static}
 .kopf .etikett{display:none}
 .kopf .schule b{font-size:15px}
 .zuord{grid-template-columns:1fr}
}
@media print{header{position:static}nav,.btn{display:none}}
/* ---------- Ergänzungen für die Workshop-Seite ---------- */
.lead{font-size:17px}
.station .nr{font-size:12px;color:var(--grau);margin-top:6px}
.station .stern{position:absolute;top:10px;left:auto;right:10px;font-size:18px;color:var(--gelb-logo)}
.station.besucht{border-top-color:var(--gruen-logo)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:2px 8px;background:var(--blau-hell);color:var(--blau)}
.chip.ok{background:var(--gruen-hell);color:var(--gruen)}
.chip.stern{background:var(--gelb-hell);color:#8a6d00}
.zweispaltig{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
@media(max-width:860px){.zweispaltig{grid-template-columns:1fr}}
/* Folienbetrachter */
.viewer{background:#fff;border:1px solid var(--blau-linie)}
.viewer .buehne{position:relative;background:#f0f2f5;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.viewer .buehne img{max-width:100%;max-height:100%;display:block}
.viewer .leiste{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-top:1px solid var(--blau-linie)}
.viewer .leiste .klein{flex:1;text-align:center}
.viewer .text{padding:8px 12px;font-size:14px;border-top:1px solid var(--blau-linie);background:var(--blau-flaeche);min-height:20px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--blau-linie)}
.thumbs button{border:2px solid transparent;padding:0;background:none;cursor:pointer;flex:0 0 auto;position:relative}
.thumbs button.aktiv{border-color:var(--blau)}
.thumbs img{width:112px;height:63px;object-fit:cover;display:block}
.thumbs span{position:absolute;left:2px;top:2px;background:rgba(0,92,169,.85);color:#fff;font-size:10px;padding:0 4px}
.kapitel{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.kapitel button{border:1px solid var(--blau-linie);background:#fff;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;border-radius:3px}
.kapitel button.aktiv{background:var(--blau);color:#fff;border-color:var(--blau)}
.lightbox{position:fixed;inset:0;background:rgba(10,20,35,.92);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}
.lightbox img{max-width:96vw;max-height:84vh;background:#fff}
.lightbox .zeile{display:flex;gap:10px;align-items:center;color:#fff}
.lightbox .btn{background:#fff;color:var(--blau)}
/* Werkzeuge */
.werkzeug h3{margin-top:4px;color:var(--blau)}
.werkzeug label.feld{display:block;font-size:14px;font-weight:bold;margin:10px 0 4px}
textarea{width:100%;min-height:70px;font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--grau-hell);border-radius:3px;resize:vertical}
textarea:focus{outline:2px solid var(--blau);outline-offset:1px}
.sterne{display:inline-flex;gap:2px}
.sterne button{background:none;border:none;font-size:24px;line-height:1;cursor:pointer;color:#cfd6df;padding:0 1px}
.sterne button.an{color:var(--gelb-logo)}
.wahl{display:inline-flex;gap:4px;flex-wrap:wrap}
.wahl button{border:1px solid var(--blau-linie);background:#fff;padding:4px 10px;font:inherit;font-size:14px;cursor:pointer;border-radius:3px}
.wahl button.an{background:var(--blau);color:#fff;border-color:var(--blau)}
.bewertung{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:15px}
.gespeichert{font-size:12px;color:var(--gruen);min-height:16px}
.impulse li{margin:4px 0}
.links li{margin:5px 0}
.links a{word-break:break-word}
.video{position:relative;aspect-ratio:16/9;background:#1E1E1E;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.matrix svg{width:100%;max-width:560px;height:auto;background:#fff;border:1px solid var(--blau-linie)}
.timer{font-size:46px;font-weight:bold;color:var(--blau);font-variant-numeric:tabular-nums}
.phase{border-left:6px solid var(--blau-linie);padding:8px 12px;margin:8px 0;background:#fff;border-top:1px solid var(--blau-linie);border-right:1px solid var(--blau-linie);border-bottom:1px solid var(--blau-linie)}
.phase.aktiv{border-left-color:var(--gelb-logo);background:var(--gelb-hell)}
.kontakt{font-size:16px;line-height:1.6}
@media print{
 header,nav,footer,.btn,.noprint,.viewer,.thumbs{display:none!important}
 body{background:#fff}
 .karte{border:none;padding:0}
 .druckkopf{display:block!important}
}
.druckkopf{display:none;border-bottom:3px solid var(--blau);margin-bottom:10px;padding-bottom:6px}
</style>
</head>

 {id:"bne", icon:"🌍", titel:"BNE – ein gemeinsames Verständnis", kurz:"Was ist nachhaltige Entwicklung?", folien:von(4,12), bewertbar:false,
  html:`<h3>Nachhaltigkeit</h3><p>Maßnahmen und Zustände, die dafür sorgen, dass in Zukunft auch noch genug Ressourcen für alle da sind.</p>
   <h3>Nachhaltige Entwicklung</h3><p>Eine lebenswerte Zukunft für alle – in allen Bereichen: <b>ökologisch, sozial, ökonomisch</b>. Die 17 Ziele für nachhaltige Entwicklung (SDGs) der Vereinten Nationen dienen dabei als Richtschnur.</p>
   <h3>Der gemeinsame Nenner</h3><p>Klimaschule Bayern verbindet ökologische Verträglichkeit, soziale Gerechtigkeit und ökonomische Leistungsfähigkeit – erweitert um Kultur &amp; Bildung, Politik, Generationen-Gerechtigkeit und Gerechtigkeit weltweit. <span class="klein">(Grafik nach Markus Lenk, Netzwerk Schule und Museum in Bayern)</span></p>
   <h3>BNE: Bildung für nachhaltige Entwicklung</h3><p>Sach- und Methodenkompetenz, Sozialkompetenz und Selbstkompetenz führen zur <b>Gestaltungskompetenz</b>: aktiv an einer lebenswerten Zukunft für alle mitwirken zu können. Schlüssel dafür sind <b>Partizipation</b> und <b>Selbstwirksamkeit</b>.</p>
   <div class="merke"><b>„Bildung für nachhaltige Entwicklung will Menschen zu aktivem Handeln und zukunftsfähigem Denken befähigen.“</b> <span class="klein">(BNE-Portal)</span><br>Also: <b>selbst aktiv werden!</b></div>`,

 {id:"beeheaven", icon:"🐝", titel:"Produktidee: Samenkugeln „BeeHeaven“", kurz:"Schülerfirma der Klara-Oppenheimer-Schule Würzburg", folien:[81,82], bewertbar:true,
  html:`<p><b>Gemeinsam für Bienen und Biodiversität</b> – Klara-Oppenheimer-Schule, Würzburg</p>
   <p>An der Fachakademie für Ernährungs- und Versorgungsmanagement wurde die Schülerfirma <b>„BeeHeaven“</b> gegründet. Gemeinsam mit Jugendlichen von Don Bosco stellten die Schülerinnen 2.000 Samenkugeln für Bienenwiesen her – aus torffreier Erde, Lehmpulver, heimischen Blumensamen und recyceltem Kaffeesatz, der zugleich als natürlicher Dünger dient. Diese Rezeptur ist bislang einzigartig auf dem Markt (Alleinstellungsmerkmal). Unterstützung kam aus Politik und Wirtschaft.</p>
   <h3>Die Idee</h3><p>Bienenfreundliche Samenkugeln ermöglichen es allen, selbst aktiv zu werden – auch ohne Garten oder Fachwissen. Man „wirft“ sie einfach auf ein Stück Erde.</p>
   <h3>Die Ziele</h3><ul><li>Artenvielfalt von Flora und Fauna durch heimische Pflanzen unterstützen</li><li>zusätzliche Nahrungsquellen für Wild- und Honigbienen schaffen</li><li>einfache Möglichkeit bieten, sich am Umweltschutz zu beteiligen</li><li>CO₂-Bindung, besseres Mikroklima, resilientere städtische Räume</li></ul>
   <h3>Der Weg</h3><ul><li><b>Beobachtung:</b> „Warum gibt es so wenig Blumenwiesen?“</li><li><b>Ideenverbindung:</b> Umweltproblem + Lösung = Produktidee; Zielgruppen: Umweltbewusste, Eltern, Lehrkräfte, Firmen</li><li><b>Test &amp; DIY:</b> erste Kugeln in der Küche, verschenken, testen</li><li><b>Vermarktung:</b> Verpackung, Storytelling, Verkauf auf Märkten, in Unverpackt-Läden, online, Landratsamt, Rathaus, Schule</li></ul>
   <h3>Werkzeugbox</h3><p>Torffreie Erde, Lehmpulver, Bienensamen, Kaffeesatz · Recyclingkarton, Etiketten · Design-Werkzeuge · Social Media, Website · Storytelling &amp; Content · Verkaufsplattformen · Kooperationen</p>
   <h3>Das nehmen die Schülerinnen und Schüler mit</h3><p>Ökologisches Verständnis · Gestaltung &amp; Produktentwicklung · wirtschaftliches Denken · gesellschaftliche Wirkung</p>
   <div class="merke"><b>Tipps:</b> Projekt partizipativ gestalten · Verantwortung verteilen · Bezug zur Lebenswelt herstellen · Projekt sichtbar machen · offen für Kritik bleiben · Erfolge feiern</div>
   <p class="klein">Kontakt laut Folie: Klara-Oppenheimer-Schule, Stettiner Straße 1, 97072 Würzburg, Tel. 0931 7908-100</p>`,

laden();

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AUFWAND = {gering:1, mittel:2, hoch:3};
const bewertet = id => { const x=stand.s[id]; return x && (x.passung||x.wirkung||x.aufwand||x.merk); };
function punktzahl(x){ if(!x||!x.passung||!x.wirkung||!x.aufwand) return null; return x.passung*2 + x.wirkung*2 - AUFWAND[x.aufwand]*2 + (x.merk?1:0); }

 stopTimerAnzeige();
 nav(STATIONEN.some(s=>s.id===id && id!=="start")?"start":id);

 ({start:seiteStart,ablauf:seiteAblauf,matrix:seiteMatrix,links:seiteLinks,kontakt:seiteKontakt}[id]||(()=>seiteStation(id)))();

 x.besucht = true; sichern();

 return `<div class="karte werkzeug"><h3>🛠️ Meine Einschätzung</h3>${bew}

function setze(id,feld,wert){ st(id)[feld]=wert; sichern(); const sc=window.scrollY; const v=V&&V.idx; seiteStation(id); if(V&&v!==null&&v!==undefined){V.idx=v;viewerZeige();} window.scrollTo(0,sc); }

/* ---------- Folienbetrachter ---------- */

function viewerZeige(){
 const s=V.s, n=s.folien[V.idx], el=$("#viewer"); if(!el) return;
 const kap = s.kapitel ? `<div class="kapitel noprint">${s.kapitel.map(([t,a,b])=>`<button class="${n>=a&&n<=b?'aktiv':''}" onclick="viewerGeheZu(${a})">${t}</button>`).join("")}</div>` : '';
 const text = [FOLIENTEXT[n], BILDQUELLE[n]].filter(Boolean).join(" · ");
 el.innerHTML = `${kap}<div class="viewer">

 </div>`;
 const akt = el.querySelector('.thumbs .aktiv'); if(akt) akt.scrollIntoView({block:"nearest",inline:"center"});
 if(document.querySelector('.lightbox')) lightbox();
}
function viewerSchritt(d){ if(!V) return; V.idx=Math.max(0,Math.min(V.s.folien.length-1,V.idx+d)); viewerZeige(); }
function viewerGeheZu(nr){ V.idx=V.s.folien.indexOf(nr); viewerZeige(); }
function lightbox(){
 let lb=document.querySelector('.lightbox'); if(!lb){lb=document.createElement('div');lb.className='lightbox';lb.onclick=e=>{if(e.target===lb)lbZu();};document.body.appendChild(lb);}
 const n=V.s.folien[V.idx];
 lb.innerHTML=`<img src="img/folien/f${String(n).padStart(3,'0')}.jpg" alt="Folie ${n}"><div class="zeile"><button class="btn" onclick="viewerSchritt(-1)">←</button><span>Folie ${n} · ${V.idx+1} von ${V.s.folien.length}</span><button class="btn" onclick="viewerSchritt(1)">→</button><button class="btn" onclick="lbZu()">✕ schließen</button></div>`;
}
function lbZu(){ const lb=document.querySelector('.lightbox'); if(lb) lb.remove(); }
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
 if(!V||!document.getElementById("viewer")) return;

/* ---------- Workshop-Ablauf mit Timer ---------- */
const PHASEN = [
 ["Erkunden",20,"Stationen in eigenem Tempo durchgehen, Folien ansehen, Links verfolgen. Interessante Maßnahmen auf die Merkliste setzen."],
 ["Bewerten",15,"Gemerkte Maßnahmen einschätzen: Passung zur eigenen Schule, erwartete Wirkung, Aufwand. Gedanken und Hürden notieren."],

];
let TIMER={rest:0,laeuft:false,phase:-1,int:null};
function seiteAblauf(){
 $("#app").innerHTML=`<div class="karte"><h2>Workshop-Ablauf</h2>
  <p>Vorschlag für die Arbeitsphase nach dem Vortrag – die Zeiten lassen sich frei anpassen. Mit dem Timer behalten Sie (oder die Moderation) die Zeit im Blick.</p>
  <div class="zweispaltig"><div id="phasen"></div>
  <div class="karte" style="text-align:center"><h3>⏱️ Timer</h3><div class="timer" id="tanz">00:00</div><p class="klein" id="tphase">Phase wählen oder Minuten eingeben</p>
   <p><input type="text" id="tmin" inputmode="numeric" style="width:80px" placeholder="Min."> <button class="btn zweit" onclick="timerSetzen(parseInt(document.getElementById('tmin').value||'0',10),-1)">setzen</button></p>
   <p><button class="btn" onclick="timerStartStop()" id="tbtn">Start</button> <button class="btn zweit" onclick="timerSetzen(0,-1)">zurücksetzen</button></p></div></div></div>`;
 phasenZeigen(); timerAnzeigen(); if(TIMER.laeuft) TIMER.anz=setInterval(timerAnzeigen,500);
}
function phasenZeigen(){ $("#phasen").innerHTML=PHASEN.map(([t,m,b],i)=>`<div class="phase ${TIMER.phase===i?'aktiv':''}"><b>${i+1}. ${t}</b> <span class="klein">(${m} min)</span><br>${b}<br><button class="btn zweit" style="margin-top:6px;padding:4px 10px;font-size:13px" onclick="timerSetzen(${m},${i})">⏱️ ${m} min starten</button></div>`).join(""); }
function timerSetzen(min,phase){ TIMER.rest=Math.max(0,min)*60; TIMER.phase=phase; if(phase>=0){TIMER.laeuft=true;TIMER.ende=Date.now()+TIMER.rest*1000;} else TIMER.laeuft=false; phasenZeigen(); timerAnzeigen(); clearInterval(TIMER.anz); if(TIMER.laeuft) TIMER.anz=setInterval(timerAnzeigen,500); }
function timerStartStop(){ if(TIMER.laeuft){TIMER.rest=Math.max(0,Math.round((TIMER.ende-Date.now())/1000));TIMER.laeuft=false;clearInterval(TIMER.anz);} else if(TIMER.rest>0){TIMER.laeuft=true;TIMER.ende=Date.now()+TIMER.rest*1000;TIMER.anz=setInterval(timerAnzeigen,500);} timerAnzeigen(); }
function timerAnzeigen(){
 const a=document.getElementById("tanz"); if(!a) return;
 let r=TIMER.laeuft?Math.max(0,Math.round((TIMER.ende-Date.now())/1000)):TIMER.rest;
 if(TIMER.laeuft&&r===0){TIMER.laeuft=false;TIMER.rest=0;clearInterval(TIMER.anz);a.style.color="var(--rot)";} else a.style.color="";
 a.textContent=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");
 document.getElementById("tbtn").textContent=TIMER.laeuft?"Pause":"Start";
 document.getElementById("tphase").textContent=TIMER.phase>=0?`Phase ${TIMER.phase+1}: ${PHASEN[TIMER.phase][0]}`:(r?"eigene Zeit":"Phase wählen oder Minuten eingeben");
}
function stopTimerAnzeige(){ clearInterval(TIMER.anz); }

  <div class="karte matrix"><h3>Aufwand-Wirkungs-Matrix</h3><p class="klein">Oben links liegen „Quick Wins“: große Wirkung bei geringem Aufwand. Die Kreisgröße zeigt die Passung zu Ihrer Schule.</p>${matrixSVG(liste)}</div>
  <div class="karte werkzeug"><h3>🎯 Mein Plan</h3>
   <label class="feld" for="p1">Diese Maßnahme(n) möchte ich an meiner Schule anstoßen:</label><textarea id="p1" oninput="planNotiz('schritt',this.value)">${esc(P.schritt)}</textarea>
   <label class="feld" for="p2">Wen hole ich ins Boot? (Schulleitung, SMV, Kollegium, Partner …)</label><textarea id="p2" oninput="planNotiz('wer',this.value)">${esc(P.wer)}</textarea>
   <label class="feld" for="p3">Mein erster Schritt – bis wann?</label><textarea id="p3" oninput="planNotiz('bis',this.value)">${esc(P.bis)}</textarea>
   <label class="feld" for="p4">Offene Fragen</label><textarea id="p4" oninput="planNotiz('offen',this.value)">${esc(P.offen)}</textarea>
   <div class="gespeichert" id="gesp_plan"></div></div>
 </div>
 <div class="karte noprint"><h3>Ergebnisse sichern</h3>
  <p>Ihre Eingaben bleiben in diesem Browser gespeichert. Zum Mitnehmen oder Teilen im Workshop:</p>
  <p><button class="btn" onclick="exportText()">⬇️ Als Textdatei herunterladen</button> <button class="btn zweit" onclick="window.print()">🖨️ Drucken / als PDF speichern</button> <button class="btn zweit" onclick="kopieren()">📋 In die Zwischenablage</button></p>
  <p><button class="btn zweit" onclick="if(confirm('Wirklich alle Bewertungen und Notizen löschen?')){stand={s:{},plan:{schritt:'',bis:'',wer:'',offen:''}};sichern();seiteMatrix();}">Alle Eingaben löschen</button></p></div>
 <div class="karte druckkopf"><h3>Notizen zu den Maßnahmen</h3>${STATIONEN.filter(s=>{const x=stand.s[s.id];return x&&(x.gedanken||x.schritte||x.huerden);}).map(s=>{const x=stand.s[s.id];return `<p><b>${s.titel}</b><br>${x.gedanken?'Gedanken: '+esc(x.gedanken)+'<br>':''}${x.schritte?'Erste Schritte: '+esc(x.schritte)+'<br>':''}${x.huerden?'Hürden: '+esc(x.huerden):''}</p>`;}).join("")||'<p>–</p>'}</div>`;
}
function planNotiz(feld,wert){ stand.plan[feld]=wert; clearTimeout(notizTimer); notizTimer=setTimeout(()=>{sichern(); const g=document.getElementById('gesp_plan'); if(g){g.textContent='✓ gespeichert'; setTimeout(()=>{if(g)g.textContent='';},1500);}},400); }
function matrixSVG(liste){
 const W=520,H=360,L=60,T=20,R=20,B=50, w=W-L-R, h=H-T-B;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Aufwand-Wirkungs-Matrix"><rect x="${L}" y="${T}" width="${w/2}" height="${h/2}" fill="#EAF5E6"/><rect x="${L+w/2}" y="${T+h/2}" width="${w/2}" height="${h/2}" fill="#FDECEA"/>`;
 s+=`<rect x="${L}" y="${T}" width="${w}" height="${h}" fill="none" stroke="#C9D9EC"/><line x1="${L+w/2}" y1="${T}" x2="${L+w/2}" y2="${T+h}" stroke="#C9D9EC" stroke-dasharray="4 3"/><line x1="${L}" y1="${T+h/2}" x2="${L+w}" y2="${T+h/2}" stroke="#C9D9EC" stroke-dasharray="4 3"/>`;
 s+=`<g font-size="12" fill="#6B6B6B" font-family="Calibri,Carlito,Arial,sans-serif"><text x="${L+6}" y="${T+16}" fill="#2E8B22" font-weight="bold">Quick Wins</text><text x="${L+w-6}" y="${T+16}" text-anchor="end">große Projekte</text><text x="${L+6}" y="${T+h-8}">kleine Schritte</text><text x="${L+w-6}" y="${T+h-8}" text-anchor="end" fill="#C62828">eher zurückstellen</text>`;
 s+=`<text x="${L+w/2}" y="${H-14}" text-anchor="middle">Aufwand → (gering · mittel · hoch)</text><text x="18" y="${T+h/2}" text-anchor="middle" transform="rotate(-90 18 ${T+h/2})">Wirkung →</text></g>`;
 const pos={}; liste.forEach(({s:st,x})=>{ if(!x.wirkung||!x.aufwand) return; const k=x.aufwand+x.wirkung; pos[k]=(pos[k]||0)+1;
   const cx=L+((AUFWAND[x.aufwand]-0.5)/3)*w + (pos[k]-1)*16, cy=T+h-((x.wirkung-0.5)/5)*h, r=6+(x.passung||1)*2.4;
   s+=`<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${x.merk?'#FCCC03':'#005CA9'}" fill-opacity=".85" stroke="#fff"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="12">${st.icon}</text><title>${st.titel}</title></g>`; });
 if(!Object.keys(pos).length) s+=`<text x="${L+w/2}" y="${T+h/2+4}" text-anchor="middle" font-size="14" fill="#6B6B6B" font-family="Calibri,Carlito,Arial,sans-serif">Noch keine Maßnahme mit Wirkung und Aufwand bewertet</text>`;
 return s+`</svg>`;
}
function exportTextInhalt(){
 const z=[]; const d=new Date().toLocaleDateString("de-DE");
 z.push("SMV – Shaping My Vision · Meine Entscheidung ("+d+")","=".repeat(50),"");
 STATIONEN.filter(s=>s.bewertbar).forEach(s=>{ const x=stand.s[s.id]||{}; const p=punktzahl(x);
  z.push("■ "+s.titel); z.push("  Passung: "+(x.passung||"–")+"/5 · Wirkung: "+(x.wirkung||"–")+"/5 · Aufwand: "+(x.aufwand||"–")+(x.merk?" · ★ Merkliste":"")+(p!==null?" · Rang-Punkte: "+p:""));
  if(x.gedanken) z.push("  Gedanken: "+x.gedanken.replace(/\n/g,"\n            "));
  if(x.schritte) z.push("  Erste Schritte: "+x.schritte.replace(/\n/g,"\n            "));
  if(x.huerden) z.push("  Hürden: "+x.huerden.replace(/\n/g,"\n            "));
  z.push(""); });
 ["bne"].forEach(id=>{const x=stand.s[id]; if(x&&x.gedanken){z.push("■ BNE – Gedanken: "+x.gedanken,"");}});
 const P=stand.plan; z.push("MEIN PLAN","-".repeat(50),"Maßnahme(n): "+(P.schritt||"–"),"Wer kommt ins Boot: "+(P.wer||"–"),"Erster Schritt / bis wann: "+(P.bis||"–"),"Offene Fragen: "+(P.offen||"–"),"","Kontakt: "+KONTAKT.name+", "+KONTAKT.mail);
 return z.join("\n");
}
function exportText(){ const b=new Blob([exportTextInhalt()],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="SMV-Meine-Entscheidung.txt"; document.body.appendChild(a); a.click(); a.remove(); }
function kopieren(){ navigator.clipboard.writeText(exportTextInhalt()).then(()=>alert("In die Zwischenablage kopiert."),()=>alert("Kopieren nicht möglich – bitte die Textdatei herunterladen.")); }

/* ---------- Linksammlung ---------- */
function seiteLinks(){
 $("#app").innerHTML=`<div class="karte"><h2>Alle Links aus dem Vortrag</h2><p>Alle Verlinkungen der Vortragsfolien nach Stationen geordnet. Die Kurzlinks (bycs.link) aus den QR-Codes führen auf dieselben Ziele.</p>
 ${STATIONEN.filter(s=>s.links&&s.links.length).map(s=>`<h3>${s.icon} ${s.titel}</h3><ul class="links">${s.links.map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${t}</a> <span class="klein">${u.replace(/^mailto:/,'')}</span></li>`).join("")}</ul>`).join("")}
 </div>`;
}

/* ---------- Kontakt ---------- */
function seiteKontakt(){
 $("#app").innerHTML=`<div class="karte"><h2>Fragen? Melden Sie sich gerne!</h2>
 <p class="kontakt"><b>${KONTAKT.name}</b><br>${KONTAKT.rolle}<br>✉️ <a href="mailto:${KONTAKT.mail}">${KONTAKT.mail}</a><br>☎️ <a href="tel:${KONTAKT.telHref}">${KONTAKT.tel}</a></p>
 <div class="info">Diese Seite ergänzt den Fachvortrag mit Workshop „SMV und BNE“. Ihre Bewertungen und Notizen werden ausschließlich lokal in Ihrem Browser gespeichert und nicht übertragen.</div></div>`;
}

const SEITEN_IDS = SEITEN.map(s=>s[0]).concat(STATIONEN.map(s=>s.id));
function ausHash(){ const h=decodeURIComponent(location.hash.slice(1)); zeige(SEITEN_IDS.includes(h)?h:"start"); }
window.addEventListener("hashchange", ausHash);
ausHash();
</script>
